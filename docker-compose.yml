services:
  postgres:
    image: postgres:16-alpine
    container_name: sms-panel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sms_panel
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5433:5432'
    volumes:
      - sms-panel-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d sms_panel']
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  sms-panel-postgres-data: